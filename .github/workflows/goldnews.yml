name: GoldNews Watcher

# Zaloha pro pripad, ze dlouhobezici smycka (loop.yml) neni ziva.
# Kdyz smycka bezi, tato workflow okamzite skonci - aby nic neprislo dvakrat.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: goldnews-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard - bezi presna smycka?
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          a=$(gh run list --workflow loop.yml   --status in_progress --limit 20 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          b=$(gh run list --workflow loop_b.yml --status in_progress --limit 20 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          n=$(( ${a:-0} + ${b:-0} ))
          echo "bezicich smycek: $n (A=$a B=$b)"
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Smycka je ziva - zaloha se nespousti."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Smycka nebezi - preberam hlidani."
          fi

      - name: Checkout
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tzdata
        if: steps.guard.outputs.skip == 'false'
        run: python -m pip install --quiet tzdata

      - name: Run watcher
        if: steps.guard.outputs.skip == 'false'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GOLDNEWS_ORIGIN: cloud-backup
          TZ: Europe/Prague
        run: python -u goldnews.py --watch

      - name: Persist state and cache
        if: always() && steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "goldnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json ff_cache.json)" ]; then
            git add state.json ff_cache.json
            git commit -m "chore: state/cache update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              sleep 5
            done
          else
            echo "zadna zmena stavu"
          fi
