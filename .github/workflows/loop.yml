name: GoldNews Loop

# Dlouhobezici presny hlidac (~5,5 h na jeden beh, kontrola kazdych 45 s).
# Nezavisi na presnosti cronu: cron slouzi jen k RESTARTU, kdyz smycka dobehne.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Bez tohoto by se pri kazdem cronu nastartovala dalsi instance.
      # Skoncime, pokud uz bezi STARSI beh teto workflow.
      - name: Guard - bezi uz jina instance?
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mine=${{ github.run_id }}
          older=$(gh run list --workflow loop.yml --status in_progress \
                    --limit 50 --json databaseId \
                    --jq "[.[] | select(.databaseId < $mine)] | length" 2>/dev/null || echo 0)
          echo "starsich behu: $older"
          if [ "${older:-0}" -gt 0 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Jina instance uz bezi - koncim."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tzdata
        if: steps.guard.outputs.skip == 'false'
        run: python -m pip install --quiet tzdata

      - name: Git identita (pro ukladani stavu ze smycky)
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "goldnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Presny hlidac (5,5 h)
        if: steps.guard.outputs.skip == 'false'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GOLDNEWS_ORIGIN: cloud-loop
          GOLDNEWS_GIT_SYNC: "1"
          TZ: Europe/Prague
        run: python -u goldnews.py --loop --minutes 330 --interval 45

      - name: Zaverecne ulozeni stavu
        if: always() && steps.guard.outputs.skip == 'false'
        run: |
          if [ -n "$(git status --porcelain state.json ff_cache.json)" ]; then
            git add state.json ff_cache.json
            git commit -m "chore: state/cache update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi

      - name: Upload logs
        if: always() && steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: loop-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
