name: GoldNews Loop A

# Presny hlidac zprav pro XAUUSD. Jeden beh ~5h20m, kontrola kazdych 45 s.
#
# Jak se to restartuje (3 nezavisle cesty, aby to nikdy neumrelo):
#   1) PRIMARNI - posledni krok tohoto behu nastartuje "Loop B" pres SELF_TOKEN.
#      Musi to byt PAT, ne GITHUB_TOKEN: udalosti vyvolane GITHUB_TOKENem
#      GitHub zamerne nespousti (ochrana proti rekurzi).
#   2) ZALOHA - workflow_run po dokonceni Loop B. Funguje, ale GitHub omezuje
#      zanoreni workflow_run na ~3 urovne, takze na tom nelze stavet samo.
#   3) ZALOHA - cron. U tohoto repa zatim nikdy nesepnul, je tu jen pro poradek.
#
# Dve smycky nesmi bezet zaraz -> viz krok "Guard".
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows: ["GoldNews Loop B"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Guard
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          skip=false
          mine=${{ github.run_id }}

          # (1) Nezretezuj po behu, ktery sam nic nedelal (byl to "skip").
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            s=$(date -u -d "${{ github.event.workflow_run.run_started_at }}" +%s 2>/dev/null || echo 0)
            e=$(date -u -d "${{ github.event.workflow_run.updated_at }}" +%s 2>/dev/null || echo 0)
            dur=$((e - s))
            echo "predchozi beh trval ${dur}s"
            if [ "$dur" -lt 120 ]; then
              echo "predchozi beh byl no-op -> nezretezuji"
              skip=true
            fi
          fi

          # (2) Jen jedna smycka. Predchudce ale muze jeste dobihat (predava
          #     rizeni), takze na nej chvili pockame - jinak by se nova smycka
          #     zbytecne vypnula a hlidani by skoncilo.
          if [ "$skip" = "false" ]; then
            for i in 1 2 3 4 5; do
              ids=$( (gh run list --workflow loop.yml   --status in_progress --limit 50 --json databaseId --jq '.[].databaseId'; \
                      gh run list --workflow loop_b.yml --status in_progress --limit 50 --json databaseId --jq '.[].databaseId') 2>/dev/null )
              # Pocitame JEN STARSI behy (mensi run id).
              # Kdyz startuji dva behy soucasne (token + workflow_run), musi jeden
              # ustoupit. Rozhoduje ID: starsi vyhrava, novejsi konci. Bez tohoto
              # by kazdy cekal na druheho a VYPNULY BY SE OBA -> nic nehlida.
              older=$(echo "$ids" | awk -v m="$mine" 'NF && $1+0 < m+0' | wc -l | tr -d ' ')
              echo "pokus $i: starsich bezicich smycek = ${older:-0}"
              if [ "${older:-0}" -eq 0 ]; then break; fi
              if [ "$i" -eq 5 ]; then
                echo "starsi smycka stale bezi -> koncim (ona hlida dal)"
                skip=true
              fi
              sleep 25
            done
          fi

          echo "skip=$skip" >> $GITHUB_OUTPUT

      - name: Checkout
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tzdata
        if: steps.guard.outputs.skip == 'false'
        run: python -m pip install --quiet tzdata

      - name: Git identita
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "goldnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Presny hlidac
        if: steps.guard.outputs.skip == 'false'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GOLDNEWS_ORIGIN: cloud-A
          GOLDNEWS_GIT_SYNC: "1"
          TZ: Europe/Prague
        run: python -u goldnews.py --loop --minutes 320 --interval 45

      - name: Zaverecne ulozeni stavu
        if: always() && steps.guard.outputs.skip == 'false'
        run: |
          if [ -n "$(git status --porcelain state.json ff_cache.json)" ]; then
            git add state.json ff_cache.json
            git commit -m "chore: state/cache update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi

      # Tohle drzi bota nazivu. Bezi i pri zruseni/padu behu.
      - name: Nastartuj navaznou smycku
        if: always() && steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.SELF_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::SELF_TOKEN chybi - navazna smycka se NENASTARTUJE."
            echo "Doplnit: spustit lokalne set_self_token.py"
            exit 0
          fi
          for i in 1 2 3; do
            if gh workflow run loop_b.yml --ref main; then
              echo "navazna smycka (Loop B) nastartovana"
              exit 0
            fi
            echo "pokus $i selhal, zkousim znovu"
            sleep 5
          done
          echo "::error::navaznou smycku se nepodarilo nastartovat"

      - name: Upload logs
        if: always() && steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: logs-A-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
