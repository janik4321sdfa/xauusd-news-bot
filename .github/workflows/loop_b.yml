name: GoldNews Loop B

# Presny hlidac (kontrola kazdych 45 s). Bezi ~5h20m, pak preda rizeni
# workflow "GoldNews Loop A" (pres udalost workflow_run). A po dobehnuti
# nastartuje zpet B. Tim mame nekonecny beh BEZ zavislosti na cronu
# (cron u GitHubu byva zpozdeny nebo se pri zatezi preskoci).
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GoldNews Loop A"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Guard
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          skip=false

          # (1) Nezretezuj po behu, ktery sam nic nedelal (byl to "skip").
          #     Bez teto pojistky by A a B po sobe strilely v nekonecne smycce.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            s=$(date -u -d "${{ github.event.workflow_run.run_started_at }}" +%s 2>/dev/null || echo 0)
            e=$(date -u -d "${{ github.event.workflow_run.updated_at }}" +%s 2>/dev/null || echo 0)
            dur=$((e - s))
            echo "predchozi beh trval ${dur}s"
            if [ "$dur" -lt 120 ]; then
              echo "predchozi beh byl no-op -> nezretezuji"
              skip=true
            fi
          fi

          # (2) Nikdy nesmi bezet dve smycky zaraz.
          if [ "$skip" = "false" ]; then
            mine=${{ github.run_id }}
            ids=$( (gh run list --workflow loop.yml   --status in_progress --limit 50 --json databaseId --jq '.[].databaseId'; \
                    gh run list --workflow loop_b.yml --status in_progress --limit 50 --json databaseId --jq '.[].databaseId') 2>/dev/null )
            others=$(echo "$ids" | grep -v "^${mine}$" | grep -c '[0-9]' || true)
            echo "jine bezici smycky: ${others:-0}"
            if [ "${others:-0}" -gt 0 ]; then
              echo "jina smycka uz bezi -> koncim"
              skip=true
            fi
          fi

          echo "skip=$skip" >> $GITHUB_OUTPUT

      - name: Checkout
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tzdata
        if: steps.guard.outputs.skip == 'false'
        run: python -m pip install --quiet tzdata

      - name: Git identita
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "goldnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Presny hlidac
        if: steps.guard.outputs.skip == 'false'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GOLDNEWS_ORIGIN: cloud-B
          GOLDNEWS_GIT_SYNC: "1"
          TZ: Europe/Prague
        run: python -u goldnews.py --loop --minutes 320 --interval 45

      - name: Zaverecne ulozeni stavu
        if: always() && steps.guard.outputs.skip == 'false'
        run: |
          if [ -n "$(git status --porcelain state.json ff_cache.json)" ]; then
            git add state.json ff_cache.json
            git commit -m "chore: state/cache update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi

      - name: Upload logs
        if: always() && steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: logs-B-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
